<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal | Chriz</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style-unified.min.css?v=3.0.0">
  <style>
    .terminal-shell {
      background: #000;
      color: var(--green2);
      border: 4px solid black;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 10px 10px 0 black;
      font-family: monospace;
      min-height: 400px;
    }
    .terminal-input {
      background: transparent;
      border: none;
      color: inherit;
      font-family: inherit;
      font-size: 1.2rem;
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>

  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo">
        <span>日本語</span>
        <div class="logo-box">Chriz</div>
      </a>
      <div class="nav-actions">
        <div class="nav-btn" id="themeToggle"><svg viewBox="0 0 24 24" width="32" height="32"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/></svg></div>
        <button class="nav-btn" id="menuToggle" title="Open Menu"><svg viewBox="0 0 24 24" width="32" height="32"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </nav>

  <div id="navMenu" class="nav-menu">
    <button id="navMenuClose" class="nav-menu-close" aria-label="Close Menu">
      <svg viewBox="0 0 24 24" width="32" height="32"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
    </button>
    <div class="nav-menu-links">
      <a href="/" class="nav-menu-link">Home</a>
      <a href="about" class="nav-menu-link">About</a>
      <a href="portfolio" class="nav-menu-link">Projects</a>
      <a href="resume" class="nav-menu-link">Resume</a>
      <a href="testimonials" class="nav-menu-link">Highlights</a>
      <a href="terminal" class="nav-menu-link">Terminal</a>
      <a href="reference" class="nav-menu-link">Grimoire</a>
      <a href="contact" class="nav-menu-link">Contact</a>
    </div>
  </div>

  <section class="hero">
    <div class="container">
      <div class="mini-badge reveal">COMMAND • CONTROL • ACCESS</div>
      <h1 class="hero-title reveal">The <span class="highlight">Console</span>.</h1>
      <p class="hero-desc reveal">Interactive shell environment for rapid project navigation and system status.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <article class="terminal-shell reveal" data-terminal-root>
        <div class="terminal-screen" data-terminal-output style="margin-bottom:20px;">
          <div>CHRIZ PORTFOLIO v1.0.0</div>
          <div>Type 'help' for commands.</div>
        </div>
        <form data-terminal-form>
          <div style="display:flex; gap:10px;">
            <span>$</span>
            <input type="text" class="terminal-input" autofocus>
          </div>
        </form>
      </article>
    </div>
  </section>

  <footer>
    © 2026 Chriz Portfolio • <a href="reference" style="color:inherit;">Grimoire</a>
  </footer>

  <script src="assets/js/main-enhanced.min.js?v=3.0.0" defer></script>
</body>
</html>
