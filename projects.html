<!DOCTYPE html>

<body>
  
  <!-- Floating Sidebar Toggle -->
  <button id="sidebar-toggle" class="sidebar-toggle-btn">[ MENU ]</button>

  <!-- Sidebar -->
  <aside class="sys-sidebar" id="sys-sidebar">
    <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--dark); padding-bottom: 15px;">
      <h2 style="font-size: 1.2rem;">SYSTEM_MENU</h2>
      <button id="sidebar-close" class="mobile-menu-btn" style="display: block;">[ X ]</button>

    <ul class="sidebar-links">
      <li><a href="/">[01] HOME</a></li>
      <li><a href="/about">[02] ABOUT</a></li>
      <li><a href="/projects">[03] PROJECTS</a></li>
      <li><a href="/blog">[04] BLOG</a></li>
      <li><a href="/contact">[05] CONTACT</a></li>
    </ul>
    <div class="sidebar-footer" style="font-family: var(--font-lcd); font-size: 0.8rem; color: var(--gray);">
      SYS_TIME: <span class="live-clock">00:00:00</span>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="dashboard-grid">
    
<section id="projects" class="card card-projects">
      <img src="assets/img/deco-2.jpg" class="deco-art deco-2" alt="Cityscape" style="mix-blend-mode: multiply; filter: grayscale(100%);">
      <div class="card-header">
        <h2 class="card-title">PROJECT_DATABASE</h2>
      </div>
      <div class="projects-grid" id="dynamic-projects-grid">

    <footer class="col-12 footer">
      <div>SKY TECH & CRAFTS // CHRIZ__3656</div>
      <div>&copy; 2026</div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="status-dot" style="width: 8px; height: 8px;"></div>
        SYSTEM STATUS: ONLINE
      </div>
    </footer>
  </main>
  <script src="assets/js/main-enhanced.js"></script>
